name: Build APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build Standard, Guard and Lite APKs
        run: ./gradlew --no-daemon assembleStandardRelease assembleGuardRelease :lite:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aerial-apks
          path: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/guard/release/*.apk
            lite/build/outputs/apk/release/*.apk
          if-no-files-found: error
