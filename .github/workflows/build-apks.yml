name: Build APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Standard, Guard and Lite APKs
        run: ./gradlew --no-daemon assembleStandardRelease assembleGuardRelease :lite:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: aerial-apks
          path: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/guard/release/*.apk
            lite/build/outputs/apk/release/*.apk
          if-no-files-found: error
